name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: nightscout_tray

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dpkg-dev fakeroot

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Compute artifact version
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${DISPATCH_TAG}" ]]; then
            echo "value=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian package
        run: |
          mkdir -p dist
          cargo deb --no-build --output "dist/${APP_NAME}-${{ steps.version.outputs.value }}-amd64.deb"

      - name: Build tar.gz archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ARCHIVE_ROOT="${APP_NAME}-${VERSION}-${TARGET}"
          mkdir -p "dist/${ARCHIVE_ROOT}"
          cp "target/release/${APP_NAME}" "dist/${ARCHIVE_ROOT}/"
          cp README.md "dist/${ARCHIVE_ROOT}/"
          cp packaging/linux/nightscout-tray.desktop "dist/${ARCHIVE_ROOT}/"
          tar -C dist -czf "dist/${ARCHIVE_ROOT}.tar.gz" "${ARCHIVE_ROOT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ steps.version.outputs.value }}
          path: dist/

  windows-release:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Compute artifact version
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${DISPATCH_TAG}" ]]; then
            echo "value=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Windows zip
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ARCHIVE_ROOT="${APP_NAME}-${VERSION}-${TARGET}"
          mkdir -p "dist/${ARCHIVE_ROOT}"
          cp "target/release/${APP_NAME}.exe" "dist/${ARCHIVE_ROOT}/"
          cp README.md "dist/${ARCHIVE_ROOT}/"
          cd dist
          powershell -Command "Compress-Archive -Path '${ARCHIVE_ROOT}' -DestinationPath '${ARCHIVE_ROOT}.zip'"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.version.outputs.value }}
          path: dist/

  publish-release:
    needs: [build-release, windows-release]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-${{ needs.build-release.outputs.version }}
          path: dist-linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ needs.windows-release.outputs.version }}
          path: dist-windows

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release.outputs.version }}
          files: |
            dist-linux/*
            dist-windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
